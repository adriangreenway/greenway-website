<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F5F2ED">
<title>The Greenway Band — Gig Sheets</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');
/* Same tokens as the current gig sheets (docs/gig-sheets/EXAMPLE/index.html). Keep exact. */
:root{--black:#0A0A09;--cream:#F5F2ED;--dim:#706D66;--faint:#4A4740;--rule:rgba(74,71,64,.22)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--cream);color:var(--black)}
body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.shell{width:min(100%,1120px);min-height:100vh;margin:auto;padding:clamp(24px,5vw,64px);display:grid;grid-template-rows:auto 1fr auto}
.masthead,.footer{display:flex;justify-content:space-between;gap:24px}
.masthead{align-items:flex-start;padding-bottom:24px;border-bottom:1px solid var(--rule)}
.wordmark{display:grid;width:max-content;line-height:.92;text-transform:uppercase}
.wordmark small{font-size:8px;font-weight:600;letter-spacing:.42em}
.wordmark strong{margin:5px 0;font-size:16px;letter-spacing:.18em}
.page-type,.eyebrow,.section-label{color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase}
main{padding:clamp(56px,9vw,112px) 0}
.eyebrow{margin-bottom:18px}
h1{font-family:'Bodoni Moda','Times New Roman',serif;font-size:clamp(46px,8vw,94px);font-weight:400;line-height:.92;letter-spacing:-.035em}
.section{margin-top:clamp(48px,8vw,88px)}
.section-label{display:flex;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.gig{display:grid;grid-template-columns:240px 1fr auto;min-height:72px;align-items:center;gap:24px;color:var(--black);border-bottom:1px solid var(--rule);text-decoration:none}
.gig:hover,.gig:focus-visible{background:var(--black);color:var(--cream);outline:none}
.gig:hover .date,.gig:focus-visible .date{color:var(--cream);opacity:.7}
.date{color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.name{font-family:'Bodoni Moda','Times New Roman',serif;font-size:clamp(24px,3vw,34px);line-height:1.1}
.name span{color:var(--dim);font-style:italic}
.gig:hover .name span,.gig:focus-visible .name span{color:var(--cream);opacity:.7}
.arrow{font-size:22px}
.empty{padding:20px 0 4px;color:var(--dim);font-size:13px}
.footer{align-items:flex-end;padding-top:24px;border-top:1px solid var(--rule);color:var(--dim);font-size:10px;line-height:1.5;letter-spacing:.08em}
@media(max-width:520px){
  .shell{padding:22px 20px}
  main{padding:52px 0}
  .eyebrow{font-size:9px;letter-spacing:.18em;line-height:1.5}
  h1{font-size:clamp(40px,11.5vw,46px);letter-spacing:-.045em}
  .gig{grid-template-columns:1fr auto;grid-template-rows:auto auto;min-height:68px;gap:4px 10px;padding:14px 0}
  .date{grid-column:1}
  .name{grid-column:1}
  .arrow{grid-column:2;grid-row:1/3}
  .footer{align-items:flex-start}
}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="wordmark" aria-label="The Greenway Band"><small>The</small><strong>Greenway</strong><small>Band</small></div>
    <div class="page-type">Gig Sheets</div>
  </header>
  <main>
    <div class="eyebrow">Every wedding's gig-day pages</div>
    <h1>Gig Sheets</h1>

    <section class="section" id="upcoming">
      <div class="section-label"><span>Upcoming</span><span id="upcoming-count"></span></div>
      <div id="upcoming-list"></div>
    </section>

    <section class="section" id="past">
      <div class="section-label"><span>Past</span><span id="past-count"></span></div>
      <div id="past-list"></div>
    </section>

    <noscript><p class="empty">Turn on JavaScript to see the list of gig sheets.</p></noscript>
  </main>
  <footer class="footer">
    <div>The sound of a great night.</div>
    <div>gigs.greenwayband.com</div>
  </footer>
</div>

<script>
/*
  ADD A GIG SHEET: one entry per wedding, then redeploy (see README.md).

  couple — as it reads on the sheet, e.g. "Courtois / Blick"
  date   — YYYY-MM-DD, the gig date
  url    — the wedding's site. Newer weddings live on the shared site:
           https://gigs.greenwayband.com/<lastname>/<mm-dd-yy>/
           Older ones are their own site: https://greenway-<lastname>.netlify.app
*/
const GIGS = [
  { couple: 'Courtois / Blick',      date: '2026-09-05', url: 'https://gigs.greenwayband.com/blick/09-05-26/' },
  { couple: 'Perugini / Shepard',    date: '2026-08-08', url: 'https://gigs.greenwayband.com/shepard/08-08-26/' },
  { couple: 'Matey / Sackschewsky',  date: '2026-08-01', url: 'https://gigs.greenwayband.com/matey/08-01-26/' },
  { couple: 'Ditta / Johnson',       date: '2026-07-11', url: 'https://greenway-ditta.netlify.app' },
  { couple: 'Freeman / Dass',        date: '2026-06-26', url: 'https://greenway-dass.netlify.app' },
  { couple: 'Buller / Cook',         date: '2026-05-30', url: 'https://may-30-aylin-acres.netlify.app' },
  { couple: 'Whaley / Gibson',       date: '2026-04-18', url: 'https://apr-18-lakeside.netlify.app' },
  { couple: 'Boulger / Neupauer',    date: '2026-04-11', url: 'https://apr-11-woodlands.netlify.app' },
  { couple: 'Velek / Reinders',      date: '2026-03-21', url: 'https://greenway-gig-saturday.netlify.app' },
  { couple: 'Hawk / Clayton',        date: '2026-03-14', url: 'https://hawk-clayton-gig-sheet.netlify.app' },
];

(function () {
  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  // Parse as a local calendar date so the day never shifts across time zones.
  function parseDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function row(gig) {
    const d = parseDate(gig.date);
    const date = `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    const name = esc(gig.couple).replace(' / ', ' <span>/</span> ');
    return `<a class="gig" href="${esc(gig.url)}">
      <span class="date">${date}</span>
      <span class="name">${name}</span>
      <span class="arrow" aria-hidden="true">&rarr;</span>
    </a>`;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const upcoming = GIGS.filter(g => parseDate(g.date) >= today)
    .sort((a, b) => parseDate(a.date) - parseDate(b.date));
  const past = GIGS.filter(g => parseDate(g.date) < today)
    .sort((a, b) => parseDate(b.date) - parseDate(a.date));

  function render(id, list, emptyText) {
    document.getElementById(id + '-list').innerHTML =
      list.length ? list.map(row).join('') : `<p class="empty">${emptyText}</p>`;
    document.getElementById(id + '-count').textContent = list.length ? String(list.length) : '';
  }

  render('upcoming', upcoming, 'No upcoming gig sheets yet.');
  render('past', past, 'No past gig sheets.');
  if (!past.length) document.getElementById('past').hidden = true;
})();
</script>
</body>
</html>
