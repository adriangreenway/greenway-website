<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#F5F2ED">
<title>Listening Room — Ditta / Johnson</title>
<link rel="manifest" href="/manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');

  :root {
    --black: #0A0A09;
    --charcoal: #111110;
    --cream: #F5F2ED;
    --muted: #B8B4AC;
    --dim: #706D66;
    --faint: #4A4740;
    --paper-rule: rgba(74, 71, 64, 0.22);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--cream);
    color: var(--black);
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .header {
    background: var(--black);
    color: var(--cream);
    min-height: 144px;
    padding: 28px max(28px, calc((100vw - 1120px) / 2));
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 32px;
    border-bottom: 1px solid #4A4740;
  }
  .header-left { display: grid; width: max-content; line-height: 0.92; text-transform: uppercase; }
  .header-left .the {
    font-size: 8px; font-weight: 600; letter-spacing: 0.42em; color: #F5F2ED;
  }
  .header-left .brand {
    margin: 5px 0; font-size: 16px; font-weight: 600; color: #F5F2ED; letter-spacing: 0.18em;
  }
  .header-left .band { font-size: 8px; font-weight: 600; letter-spacing: 0.42em; color: #F5F2ED; }
  .header-right { max-width: 560px; text-align: right; }
  .header-right .label {
    font-size: 9px; font-weight: 600; letter-spacing: 0.24em; color: #706D66; text-transform: uppercase;
  }
  .header-right .event {
    margin-top: 8px;
    font-family: 'Bodoni Moda', 'Times New Roman', serif;
    font-size: clamp(24px, 3vw, 38px);
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #F5F2ED;
  }
  .header-right .date { font-size: 11px; color: #B8B4AC; margin-top: 8px; }

  .body {
    padding: clamp(48px, 7vw, 80px) 28px 64px;
    max-width: 760px;
    margin: 0 auto;
  }

  .section-label {
    margin-bottom: 14px;
    font-family: 'Bodoni Moda', 'Times New Roman', serif;
    font-size: clamp(38px, 6vw, 58px);
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--black);
  }
  .section-note {
    max-width: 520px; font-size: 13px; color: var(--dim); margin-bottom: 44px; line-height: 1.7;
  }
  .empty-state {
    border-top: 1px solid var(--paper-rule);
    border-bottom: 1px solid var(--paper-rule);
    border-radius: 0;
    padding: 28px 0;
    color: var(--dim);
    font-size: 14px;
    line-height: 1.6;
  }

  #trackList { border-top: 1px solid var(--paper-rule); }

  .track-card {
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--paper-rule);
    border-radius: 0;
    padding: 30px 0;
    margin: 0;
  }

  .track-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 28px;
  }
  .track-info { min-width: 0; flex: 1; }
  .track-title {
    font-family: 'Bodoni Moda', 'Times New Roman', serif;
    font-size: clamp(26px, 4vw, 34px);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--black);
    margin-bottom: 4px;
  }
  .track-artist {
    font-size: 13px;
    color: var(--dim);
    font-weight: 400;
  }
  .track-context {
    margin-top: 14px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 0;
    border-radius: 0;
    background: transparent;
    color: var(--black);
  }

  .transport {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 0;
  }

  .play-btn {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 0;
    border: 1px solid var(--black);
    background: var(--black);
    color: var(--cream);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .play-btn:active { transform: scale(0.93); }
  .play-btn.playing {
    background: transparent;
    color: var(--black);
    border-color: var(--black);
  }

  .skip-btn {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 0;
    border: 1px solid var(--paper-rule);
    background: transparent;
    color: var(--dim);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    gap: 2px;
    transition: all 0.2s;
  }
  .skip-btn:active { transform: scale(0.9); }
  .skip-btn:hover { color: var(--black); border-color: var(--black); }
  .skip-btn .skip-icon { font-size: 13px; }

  .audio-controls {
    margin-top: 22px;
    display: block;
  }

  .progress-bar {
    width: 100%;
    height: 20px;
    padding: 9px 0;
    background: linear-gradient(to bottom, transparent 9px, var(--paper-rule) 9px, var(--paper-rule) 11px, transparent 11px);
    border-radius: 0;
    cursor: pointer;
    margin-bottom: 8px;
    position: relative;
  }
  .progress-fill {
    position: absolute;
    top: 9px;
    left: 0;
    height: 2px;
    background: var(--black);
    border-radius: 0;
    width: 0%;
    transition: width 0.1s linear;
  }
  .time-display {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--dim);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .error-msg {
    margin-top: 12px;
    font-size: 12px;
    color: var(--dim);
    display: none;
  }

  .back-link {
    display: inline-block;
    min-height: 44px;
    margin-top: 40px;
    border-bottom: 1px solid var(--paper-rule);
    font-size: 10px;
    font-weight: 600;
    line-height: 44px;
    color: var(--dim);
    text-decoration: none;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .back-link:hover { color: var(--black); border-bottom-color: var(--black); }

  @media (max-width: 520px) {
    .header { min-height: 132px; padding: 22px 20px; align-items: flex-start; }
    .header-right { max-width: 220px; }
    .header-right .event { margin-top: 6px; font-size: 22px; line-height: 1.05; }
    .body { padding: 44px 20px 52px; }
    .section-note { margin-bottom: 34px; }
    .track-card { padding: 26px 0; }
    .track-top { flex-direction: column; gap: 22px; }
    .transport { width: 100%; justify-content: flex-start; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="the">The</div>
    <div class="brand">Greenway</div>
    <div class="band">Band</div>
  </div>
  <div class="header-right">
    <div class="label">Listening Room</div>
    <div class="event">Ditta / Johnson</div>
    <div class="date">Saturday, July 11, 2026</div>
  </div>
</div>

<div class="body">

  <div class="section-label">Songs to Learn</div>
  <div class="section-note">Listen through each track before the gig. Closing Time is the final song, all guests, live.</div>

  <div id="trackList">
    <!-- Tracks are rendered by JS -->
  </div>

  <a class='back-link' href='index.html'>&larr; Back to Gig Sheet</a>
</div>

<script>
const TRACKS = [
  {
    title: '"Closing Time"',
    artist: 'Semisonic',
    context: 'Final Song, All Guests — LIVE',
    file: 'audio/closing-time-practice-track.mp3'
  }
];

let currentAudio = null;
let currentCard = null;

function formatTime(s) {
  if (isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function renderTracks() {
  const list = document.getElementById('trackList');

  if (TRACKS.length === 0) {
    list.innerHTML = '<div class="empty-state">No practice tracks have been added yet.</div>';
    return;
  }

  TRACKS.forEach((track, i) => {
    const card = document.createElement('div');
    card.className = 'track-card';
    card.id = 'track-' + i;
    card.innerHTML = `
      <div class="track-top">
        <div class="track-info">
          <div class="track-title">${track.title}</div>
          <div class="track-artist">${track.artist}</div>
          <div class="track-context">${track.context}</div>
        </div>
        <div class="transport">
          <button class="skip-btn" data-index="${i}" data-skip="-10"><span class="skip-icon">&#8634;</span>10s</button>
          <button class="play-btn" data-index="${i}">&#9654;</button>
          <button class="skip-btn" data-index="${i}" data-skip="10"><span class="skip-icon">&#8635;</span>10s</button>
        </div>
      </div>
      <div class="audio-controls">
        <div class="progress-bar" data-index="${i}">
          <div class="progress-fill"></div>
        </div>
        <div class="time-display">
          <span class="time-current">0:00</span>
          <span class="time-total">0:00</span>
        </div>
      </div>
      <div class="error-msg" id="error-${i}">File not found. Upload the MP3 or add it to the audio/ folder.</div>
    `;
    list.appendChild(card);
  });
}

function togglePlay(index) {
  const track = TRACKS[index];
  const card = document.getElementById('track-' + index);
  const btn = card.querySelector('.play-btn');
  const errorEl = document.getElementById('error-' + index);

  // If clicking the currently playing track, pause/resume
  if (currentAudio && currentCard === card) {
    if (currentAudio.paused) {
      currentAudio.play();
      card.className = 'track-card playing';
      btn.innerHTML = '&#9646;&#9646;';
      btn.classList.add('playing');
    } else {
      currentAudio.pause();
      card.className = 'track-card paused';
      btn.innerHTML = '&#9654;';
      btn.classList.remove('playing');
    }
    return;
  }

  // Stop current
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    if (currentCard) {
      currentCard.className = 'track-card';
      currentCard.querySelector('.play-btn').innerHTML = '&#9654;';
      currentCard.querySelector('.play-btn').classList.remove('playing');
    }
  }

  // Use blob URL if available (uploaded file), otherwise use file path
  const src = track.blobUrl || track.file;
  const audio = new Audio(src);

  audio.addEventListener('error', () => {
    errorEl.style.display = 'block';
    card.className = 'track-card';
    btn.innerHTML = '&#9654;';
    btn.classList.remove('playing');
  });

  audio.addEventListener('loadedmetadata', () => {
    errorEl.style.display = 'none';
    card.querySelector('.time-total').textContent = formatTime(audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    const pct = (audio.currentTime / audio.duration) * 100;
    card.querySelector('.progress-fill').style.width = pct + '%';
    card.querySelector('.time-current').textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener('ended', () => {
    card.className = 'track-card';
    btn.innerHTML = '&#9654;';
    btn.classList.remove('playing');
    currentAudio = null;
    currentCard = null;
  });

  audio.play().then(() => {
    card.className = 'track-card playing';
    btn.innerHTML = '&#9646;&#9646;';
    btn.classList.add('playing');
    currentAudio = audio;
    currentCard = card;
  }).catch(() => {
    errorEl.style.display = 'block';
  });
}

// Event delegation for play buttons and progress bars
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.play-btn');
  if (btn) {
    togglePlay(parseInt(btn.dataset.index));
    return;
  }

  const skipBtn = e.target.closest('.skip-btn');
  if (skipBtn) {
    const index = parseInt(skipBtn.dataset.index);
    const card = document.getElementById('track-' + index);
    if (currentAudio && currentCard === card) {
      const delta = parseInt(skipBtn.dataset.skip);
      currentAudio.currentTime = Math.min(
        Math.max(currentAudio.currentTime + delta, 0),
        currentAudio.duration || Infinity
      );
    } else {
      togglePlay(index);
    }
    return;
  }

  const bar = e.target.closest('.progress-bar');
  if (bar && currentAudio && currentCard === document.getElementById('track-' + bar.dataset.index)) {
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    currentAudio.currentTime = pct * currentAudio.duration;
  }
});

renderTracks();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
