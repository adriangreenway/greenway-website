<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');
:root{--black:#0A0A09;--cream:#F5F2ED;--muted:#B8B4AC;--dim:#706D66;--faint:#4A4740;--rule:rgba(74,71,64,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--cream);color:var(--black)}
body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.header{min-height:144px;padding:28px max(28px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:flex-end;gap:32px;background:var(--black);color:var(--cream);border-bottom:1px solid var(--faint)}
.wordmark{display:grid;width:max-content;line-height:.92;text-transform:uppercase}
.wordmark small{font-size:8px;font-weight:600;letter-spacing:.42em}
.wordmark strong{margin:5px 0;font-size:16px;letter-spacing:.18em}

.event h1{margin-top:8px;font-family:'Plus Jakarta Sans',-apple-system,sans-serif;font-size:clamp(20px,2.6vw,30px);font-weight:600;line-height:1}
.event p{margin-top:8px;color:var(--muted);font-size:11px}
.body{width:min(100%,760px);margin:auto;padding:clamp(48px,7vw,80px) 28px 64px}
.body h2{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;font-size:clamp(32px,5vw,48px);font-weight:600;line-height:1.02;letter-spacing:-.015em}
#trackList:not(:empty){margin-top:36px;border-top:1px solid var(--rule)}
.empty-state{margin-top:24px;color:var(--dim);font-size:13px}
.track-card{padding:30px 0;border-bottom:1px solid var(--rule)}

.track-title{margin-bottom:4px;font-family:'Plus Jakarta Sans',-apple-system,sans-serif;font-size:clamp(20px,3vw,26px);font-weight:600;line-height:1.15;letter-spacing:-.01em}

.lyrics-panel.open{display:block}
.lyrics-panel.timed{position:relative;max-height:min(46vh,420px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.lyric-line{display:block;padding:2px 0;cursor:pointer;transition:color 200ms ease-out}

<script>
// Registry of the LIVE songs (never a track that plays as a recording).

// audio/ appear automatically; local drops match by filename and slot into
// show order. To publish for the whole band: MP3 into audio/ (kebab-case
// name below), bump sw.js CACHE, redeploy the whole greenway-gigs folder.
// lyrics: a plain string, or timed lines [[seconds, 'line'], ...] exported from
// the AbleSet .als with docs/gig-sheets/tools/als-lyrics.py (website repo).
// Timed lines highlight as the track plays; tapping one jumps the track there.
const TRACKS = [
  {

  {

  },
  {
    title: 'You Never Even Called Me by My Name',
    artist: 'David Allan Coe',
    context: 'Songs to Learn',
    file: 'audio/you-never-even-called-me-by-my-name.mp3'
  },
  {
    title: '9 to 5',
    artist: 'Dolly Parton',
    context: 'Songs to Learn',
    file: 'audio/9-to-5.mp3',
    lyrics: '[Verse 1]\n\nTumble out of bed and I stumble to the kitchen\nPour myself a cup of ambition\nAnd yawn and stretch and try to come to life\n\nJump in the shower and the blood starts pumpin\'\nOut on the street, the traffic starts jumpin\'\nWith folks like me on the job from 9 to 5\n\n[Chorus]\n\nWorkin\' 9 to 5, what a way to make a livin\'\nBarely gettin\' by, it\'s all takin\' and no givin\'\nThey just use your mind and they never give you credit\nIt\'s enough to drive you crazy if you let it\n\n9 to 5, for service and devotion\nYou would think that I would deserve a fair promotion\nWant to move ahead, but the boss won\'t seem to let me\nI swear sometimes that man is out to get me, mm\n\n[Verse 2]\nThey let you dream just to watch \'em shatter\nYou\'re just a step on the bossman\'s ladder\nBut you\'ve got dreams he\'ll never take away\n\nIn the same boat with a lot of your friends\nWaitin\' for the day your ship\'ll come in\nAnd the tide\'s gonna turn and it\'s all gonna roll your way\n\n[Chorus]\n\nWorkin\' 9 to 5, what a way to make a livin\'\nBarely gettin\' by, it\'s all takin\' and no givin\'\nThey just use your mind and you never get the credit\nIt\'s enough to drive you crazy if you let it\n\n9 to 5, yeah, they got you where they want you\nThere\'s a better life and you think about it, don\'t you?\nIt\'s a rich man\'s game no matter what they call it\nAnd you spend your life puttin\' money in his wallet\n\n9 to 5, oh, what a way to make a livin\'\nBarely gettin\' by, it\'s all takin\' and no givin\'\nThey just use your mind and they never give you credit\n\nIt\'s enough to drive you crazy if you let it\n9 to 5, yeah, they got you where they want you\nThere\'s a better life and you think about it, don\'t you?\n\nIt\'s a rich man\'s game no matter what they call it\nAnd you spend your life puttin\' money in his wallet\n9 to 5...'

    lyrics: '[Verse 1]\n\nYeah, that\'s my old girlfriend\nI saw her when she walked in\nHer hair\'s a little longer but she\'s still lookin\' stronger than sin\nNo, I don\'t care if you buy her a drink\nBut she\'s not the kind of girl you\'d think\nOh \'cause back when we were lovin\'\nShe thought cowboys were something\nNow they ain\'t\n\n[Chorus]\n\n\'Cause she\'s over buckles\nShe\'s over spurs\nTo her, you\'re just a heartache in a pearl snap shirt\nBeen lassoed and let go for the last time\nNo, she ain\'t just over me\nShe\'s over me and my kind\n\n[Verse 2]\n\nI guess I ruined it for the rest of us\nWhen I left her standing in my dust\nOh and lately she\'s been hating rodeos and Copenhagen\nAnd trucks, ha\n\n[Chorus]\n\nYeah, she\'s over buckles\nShe\'s over spurs\nTo her, you\'re just a heartache in a pearl snap shirt\nBeen lassoed and let go for the last time\nNo, she ain\'t just over me\nShe\'s over me and my kind'

];

const audios = [];
let currentIndex = null;

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return '0:00';
  const minutes = Math.floor(seconds / 60);
  const remainder = Math.floor(seconds % 60);
  return minutes + ':' + (remainder < 10 ? '0' : '') + remainder;
}

function updateProgress(index) {
  const audio = audios[index];
  const card = document.getElementById('track-' + index);
  if (!audio || !card) return;
  const percent = Number.isFinite(audio.duration) && audio.duration > 0
    ? (audio.currentTime / audio.duration) * 100
    : 0;
  card.querySelector('.progress-fill').style.width = percent + '%';
  card.querySelector('.time-current').textContent = formatTime(audio.currentTime);
  card.querySelector('.progress-bar').setAttribute('aria-valuenow', String(Math.floor(audio.currentTime)));
  syncLyrics(index, audio.currentTime);
}

function pauseOtherTracks(index) {
  audios.forEach((audio, audioIndex) => {
    if (audio && audioIndex !== index && !audio.paused) audio.pause();
  });
}

function togglePlay(index) {
  const audio = audios[index];
  if (!audio || !audio.src) return;
  if (audio.paused) {
    pauseOtherTracks(index);
    currentIndex = index;
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
}

function skip(index, seconds) {
  const audio = audios[index];
  if (!audio || !audio.src) return;
  const limit = Number.isFinite(audio.duration) ? audio.duration : Infinity;
  audio.currentTime = Math.min(Math.max(audio.currentTime + seconds, 0), limit);
  updateProgress(index);
}

function seek(index, event) {
  const audio = audios[index];
  if (!audio || !audio.src || !Number.isFinite(audio.duration)) return;
  const bar = event.target.closest('.progress-bar');
  if (!bar) return;
  const rect = bar.getBoundingClientRect();
  const percent = Math.min(Math.max((event.clientX - rect.left) / rect.width, 0), 1);
  audio.currentTime = percent * audio.duration;
  updateProgress(index);
}

// Renders a card for TRACKS[index], inserted in registry order among the
// cards already on the page. Only called once audio for it actually exists.
function escHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

// Timed lyrics: [[seconds, 'line'], ...]. The latest line whose time has passed
// is highlighted as the track plays; tapping a line jumps the track to it.
function renderLyrics(lyrics) {
  if (!Array.isArray(lyrics)) return escHtml(lyrics);
  return lyrics.map((entry, i) =>
    '<span class="lyric-line" data-t="' + entry[0] + '" data-line="' + i + '">' + escHtml(entry[1]) + '</span>'
  ).join('');
}

function scrollLyricsToCurrent(panel, smooth) {
  const line = panel.querySelector('.lyric-line.current');
  if (!line || !panel.classList.contains('open')) return;
  const top = Math.max(0, line.offsetTop - panel.clientHeight * 0.35);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  panel.scrollTo({ top: top, behavior: smooth && !reduce ? 'smooth' : 'auto' });
}

function syncLyrics(index, time) {
  const track = TRACKS[index];
  if (!track || !Array.isArray(track.lyrics)) return;
  const panel = document.getElementById('lyrics-' + index);
  if (!panel) return;
  let current = -1;
  for (let i = 0; i < track.lyrics.length; i++) {
    if (track.lyrics[i][0] <= time + 0.15) current = i; else break;
  }
  const previous = panel.querySelector('.lyric-line.current');
  if (previous && Number(previous.dataset.line) === current) return;
  if (previous) previous.classList.remove('current');
  if (current < 0) return;
  const line = panel.querySelector('.lyric-line[data-line="' + current + '"]');
  if (!line) return;
  line.classList.add('current');
  scrollLyricsToCurrent(panel, true);
}

function ensureCard(index) {
  let card = document.getElementById('track-' + index);
  if (card) return card;
  document.getElementById('emptyState').style.display = 'none';
  const track = TRACKS[index];
  card = document.createElement('article');
  card.className = 'track-card';
  card.id = 'track-' + index;
  card.dataset.order = index;
  const details = [];
  if (track.context) details.push('<span class="track-detail">Live</span>');
  if (track.key) details.push('<span class="track-detail">' + track.key + '</span>');
  if (track.bpm) details.push('<span class="track-detail">' + track.bpm + '</span>');
  card.innerHTML =
    '<div class="track-top">' +
      '<div class="track-info">' +
        '<div class="track-title">' + track.title + '</div>' +
        (track.artist ? '<div class="track-artist">' + track.artist + '</div>' : '') +
        (track.context ? '<div class="track-context">' + track.context + '</div>' : '') +
        (details.length ? '<div class="track-details">' + details.join('') + '</div>' : '') +
        (track.lyrics ? '<button class="lyrics-btn" type="button" data-index="' + index + '" aria-expanded="false">Lyrics</button>' : '') +
      '</div>' +
      '<div class="transport">' +
        '<button class="skip-btn" type="button" data-index="' + index + '" data-skip="-10" aria-label="Rewind ' + track.title + ' 10 seconds" disabled>&#8634; 10</button>' +
        '<button class="play-btn" type="button" data-index="' + index + '" aria-label="Play ' + track.title + '" disabled>&#9654;</button>' +
        '<button class="skip-btn" type="button" data-index="' + index + '" data-skip="10" aria-label="Forward ' + track.title + ' 10 seconds" disabled>10 &#8635;</button>' +
      '</div>' +
    '</div>' +
    '<div class="audio-controls">' +
      '<button class="progress-bar" type="button" data-index="' + index + '" role="slider" aria-label="Seek through ' + track.title + '" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" disabled>' +
        '<span class="progress-track"><span class="progress-fill"></span></span>' +
      '</button>' +
      '<div class="time-display"><span class="time-current">0:00</span><span class="time-total">0:00</span></div>' +
    '</div>' +
    (track.lyrics ? '<div class="lyrics-panel' + (Array.isArray(track.lyrics) ? ' timed' : '') + '" id="lyrics-' + index + '">' + renderLyrics(track.lyrics) + '</div>' : '') +
    '<div class="track-status"></div>';

  if (track.lyrics) {
    card.querySelector('.lyrics-btn').addEventListener('click', () => {
      const btn = card.querySelector('.lyrics-btn');
      const panel = card.querySelector('.lyrics-panel');
      const open = panel.classList.toggle('open');
      btn.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
      if (open) scrollLyricsToCurrent(panel, false);
    });
  }

  const list = document.getElementById('trackList');
  const siblings = [...list.children];
  const next = siblings.find(el => Number(el.dataset.order) > index);
  list.insertBefore(card, next || null);

  const audio = new Audio();
  audio.preload = 'metadata';
  audios[index] = audio;

  audio.addEventListener('loadedmetadata', () => {
    card.querySelector('.time-total').textContent = formatTime(audio.duration);
    card.querySelector('.progress-bar').setAttribute('aria-valuemax', String(Math.floor(audio.duration)));
    card.querySelector('.track-status').style.display = 'none';
    card.querySelectorAll('button').forEach(button => { button.disabled = false; });
  });
  audio.addEventListener('timeupdate', () => updateProgress(index));
  audio.addEventListener('play', () => {
    card.classList.add('playing');
    const button = card.querySelector('.play-btn');
    button.classList.add('playing');
    button.innerHTML = '&#9646;&#9646;';
    button.setAttribute('aria-label', 'Pause ' + track.title);
  });
  audio.addEventListener('pause', () => {
    card.classList.remove('playing');
    const button = card.querySelector('.play-btn');
    button.classList.remove('playing');
    button.innerHTML = '&#9654;';
    button.setAttribute('aria-label', 'Play ' + track.title);
  });
  audio.addEventListener('ended', () => {
    audio.currentTime = 0;
    updateProgress(index);
    if (currentIndex === index) currentIndex = null;
  });
  audio.addEventListener('error', () => {
    const status = card.querySelector('.track-status');
    status.textContent = 'Track unavailable.';
    status.style.display = 'block';
  });
  return card;
}

function attachSource(index, src) {
  ensureCard(index);
  const audio = audios[index];
  audio.src = src;
  audio.load();
}

function compact(text) {
  return text.toLowerCase().replace(/[^a-z0-9]/g, '');
}

function loadDeployedTracks() {
  TRACKS.forEach((track, index) => {
    if (!track.file) return;
    fetch(track.file)
      .then(response => {
        if (!response.ok) throw new Error('missing');
        return response.blob();
      })
      .then(blob => attachSource(index, URL.createObjectURL(blob)))
      .catch(() => {});
  });
}

function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('audio/') && !/\.mp3$/i.test(file.name)) return;
    const blobUrl = URL.createObjectURL(file);
    const name = file.name.replace(/\.[^.]+$/, '');
    const inputSlug = compact(name);

    let matchedIndex = -1;
    TRACKS.forEach((track, i) => {
      if (matchedIndex !== -1) return;
      const trackSlug = compact(track.file ? track.file.split('/').pop().replace('.mp3', '') : track.title);
      const titleSlug = compact(track.title);
      if (inputSlug.includes(trackSlug) || trackSlug.includes(inputSlug) ||
          inputSlug.includes(titleSlug) || titleSlug.includes(inputSlug)) {
        matchedIndex = i;
      }
    });

    if (matchedIndex === -1) {
      matchedIndex = TRACKS.length;
      TRACKS.push({ title: name, artist: '', context: '', file: '' });
    }
    attachSource(matchedIndex, blobUrl);
  });
}

document.addEventListener('click', event => {
  const lyricLine = event.target.closest('.lyric-line');
  if (lyricLine) {
    const index = Number(lyricLine.closest('.lyrics-panel').id.replace('lyrics-', ''));
    const audio = audios[index];
    if (audio && audio.src && audio.readyState > 0) {
      audio.currentTime = Number(lyricLine.dataset.t);
      updateProgress(index);
    }
    return;
  }
  const playButton = event.target.closest('.play-btn');
  if (playButton) { togglePlay(Number(playButton.dataset.index)); return; }
  const skipButton = event.target.closest('.skip-btn');
  if (skipButton) { skip(Number(skipButton.dataset.index), Number(skipButton.dataset.skip)); return; }
  const progressBar = event.target.closest('.progress-bar');
  if (progressBar) seek(Number(progressBar.dataset.index), event);
});

document.addEventListener('keydown', event => {
  const progressBar = event.target.closest('.progress-bar');
  if (!progressBar) return;
  const index = Number(progressBar.dataset.index);
  if (event.key === 'ArrowLeft') { event.preventDefault(); skip(index, -10); }
  if (event.key === 'ArrowRight') { event.preventDefault(); skip(index, 10); }
});

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('keydown', event => {
  if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); fileInput.click(); }
});
fileInput.addEventListener('change', event => { handleFiles(event.target.files); fileInput.value = ''; });
['dragover', 'dragenter'].forEach(type => document.addEventListener(type, event => {
  event.preventDefault();
  uploadZone.classList.add('dragover');
}));
['dragleave', 'dragend'].forEach(type => document.addEventListener(type, event => {
  if (!event.relatedTarget) uploadZone.classList.remove('dragover');
}));
document.addEventListener('drop', event => {
  event.preventDefault();
  uploadZone.classList.remove('dragover');
  if (event.dataTransfer && event.dataTransfer.files.length) handleFiles(event.dataTransfer.files);
});

loadDeployedTracks();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
}
</script>
<script>if('serviceWorker' in navigator){const u=()=>navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)u();});window.addEventListener('online',u);setInterval(u,300000);}</script>
