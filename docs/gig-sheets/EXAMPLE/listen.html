<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0A0A09">
<title>Listening Room — Ditta / Johnson</title>
<link rel="manifest" href="/manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #0A0A09;
    color: #F5F2ED;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .header {
    background: #0A0A09;
    padding: 20px 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid rgba(196,163,90,0.3);
  }
  .header-left .the {
    font-size: 9px; font-weight: 700; letter-spacing: 4px; color: #C4A35A; text-transform: uppercase;
  }
  .header-left .brand {
    font-size: 22px; font-weight: 800; color: #F5F2ED; letter-spacing: 2px;
  }
  .header-right { text-align: right; }
  .header-right .label {
    font-size: 9px; font-weight: 700; letter-spacing: 3px; color: #C4A35A; text-transform: uppercase;
  }
  .header-right .event { font-size: 15px; font-weight: 700; color: #F5F2ED; }
  .header-right .date { font-size: 11px; color: #706D66; margin-top: 2px; }

  .body {
    padding: 28px;
    max-width: 600px;
    margin: 0 auto;
  }

  .section-label {
    font-size: 9px; font-weight: 700; letter-spacing: 3px; color: #C4A35A;
    text-transform: uppercase; margin-bottom: 16px;
  }
  .section-note {
    font-size: 13px; color: #706D66; margin-bottom: 24px; line-height: 1.6;
  }

  .track-card {
    background: rgba(245,242,237,0.04);
    border: 1px solid rgba(245,242,237,0.08);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .track-card.playing {
    border-color: rgba(196,163,90,0.4);
    background: rgba(196,163,90,0.06);
  }

  .track-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .track-info { flex: 1; }
  .track-title {
    font-size: 18px;
    font-weight: 700;
    color: #F5F2ED;
    margin-bottom: 2px;
  }
  .track-artist {
    font-size: 14px;
    color: #706D66;
    font-weight: 500;
  }
  .track-context {
    display: inline-block;
    margin-top: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(196,163,90,0.15);
    color: #C4A35A;
  }

  .transport {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 16px;
  }

  .play-btn {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid rgba(196,163,90,0.4);
    background: transparent;
    color: #C4A35A;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .play-btn:active { transform: scale(0.93); }
  .play-btn.playing {
    background: #C4A35A;
    color: #0A0A09;
    border-color: #C4A35A;
  }

  .skip-btn {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(245,242,237,0.15);
    background: transparent;
    color: #706D66;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    gap: 2px;
    transition: all 0.2s;
  }
  .skip-btn:active { transform: scale(0.9); }
  .skip-btn:hover { color: #C4A35A; border-color: rgba(196,163,90,0.4); }
  .skip-btn .skip-icon { font-size: 13px; }

  .audio-controls {
    margin-top: 12px;
    display: none;
  }
  .track-card.playing .audio-controls,
  .track-card.paused .audio-controls {
    display: block;
  }

  .progress-bar {
    width: 100%;
    height: 4px;
    background: rgba(245,242,237,0.1);
    border-radius: 2px;
    cursor: pointer;
    margin-bottom: 8px;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: #C4A35A;
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
  }
  .time-display {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #706D66;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .error-msg {
    margin-top: 8px;
    font-size: 12px;
    color: #cc4444;
    display: none;
  }

  .upload-section {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid rgba(245,242,237,0.08);
  }

  .upload-zone {
    border: 2px dashed rgba(196,163,90,0.3);
    border-radius: 12px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .upload-zone:hover,
  .upload-zone.dragover {
    border-color: #C4A35A;
    background: rgba(196,163,90,0.04);
  }
  .upload-zone-text {
    font-size: 14px;
    color: #706D66;
    font-weight: 500;
  }
  .upload-zone-text strong {
    color: #C4A35A;
  }
  .upload-zone-sub {
    font-size: 12px;
    color: #504E49;
    margin-top: 6px;
  }

  .back-link {
    display: inline-block;
    margin-top: 32px;
    font-size: 13px;
    font-weight: 600;
    color: #706D66;
    text-decoration: none;
    letter-spacing: 0.5px;
  }
  .back-link:hover { color: #C4A35A; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="the">The</div>
    <div class="brand">GREENWAY BAND</div>
  </div>
  <div class="header-right">
    <div class="label">Listening Room</div>
    <div class="event">Ditta / Johnson</div>
    <div class="date">Saturday, July 11, 2026</div>
  </div>
</div>

<div class="body">

  <div class="section-label">Songs to Learn</div>
  <div class="section-note">Listen through each track before the gig. Closing Time is the final song, all guests, live.</div>

  <div id="trackList">
    <!-- Tracks are rendered by JS -->
  </div>

  <div class="upload-section">
    <div class="section-label">Add Tracks</div>
    <div class="upload-zone" id="uploadZone">
      <div class="upload-zone-text">Drag MP3 files here or <strong>tap to browse</strong></div>
      <div class="upload-zone-sub">Files play locally in your browser</div>
    </div>
    <input type="file" id="fileInput" accept="audio/*" multiple style="display:none;">
  </div>

  <a class='back-link' href='/'>&larr; Back to Gig Day</a>
</div>

<script>
const TRACKS = [
  {
    title: '"Closing Time"',
    artist: 'Semisonic',
    context: 'Final Song, All Guests — LIVE',
    file: 'audio/closing-time-practice-track.mp3'
  }
];

let currentAudio = null;
let currentCard = null;

function formatTime(s) {
  if (isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

function renderTracks() {
  const list = document.getElementById('trackList');

  TRACKS.forEach((track, i) => {
    const card = document.createElement('div');
    card.className = 'track-card';
    card.id = 'track-' + i;
    card.innerHTML = `
      <div class="track-top">
        <div class="track-info">
          <div class="track-title">${track.title}</div>
          <div class="track-artist">${track.artist}</div>
          <div class="track-context">${track.context}</div>
        </div>
        <div class="transport">
          <button class="skip-btn" data-index="${i}" data-skip="-10"><span class="skip-icon">&#8634;</span>10s</button>
          <button class="play-btn" data-index="${i}">&#9654;</button>
          <button class="skip-btn" data-index="${i}" data-skip="10"><span class="skip-icon">&#8635;</span>10s</button>
        </div>
      </div>
      <div class="audio-controls">
        <div class="progress-bar" data-index="${i}">
          <div class="progress-fill"></div>
        </div>
        <div class="time-display">
          <span class="time-current">0:00</span>
          <span class="time-total">0:00</span>
        </div>
      </div>
      <div class="error-msg" id="error-${i}">File not found. Upload the MP3 or add it to the audio/ folder.</div>
    `;
    list.appendChild(card);
  });
}

function togglePlay(index) {
  const track = TRACKS[index];
  const card = document.getElementById('track-' + index);
  const btn = card.querySelector('.play-btn');
  const errorEl = document.getElementById('error-' + index);

  // If clicking the currently playing track, pause/resume
  if (currentAudio && currentCard === card) {
    if (currentAudio.paused) {
      currentAudio.play();
      card.className = 'track-card playing';
      btn.innerHTML = '&#9646;&#9646;';
      btn.classList.add('playing');
    } else {
      currentAudio.pause();
      card.className = 'track-card paused';
      btn.innerHTML = '&#9654;';
      btn.classList.remove('playing');
    }
    return;
  }

  // Stop current
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    if (currentCard) {
      currentCard.className = 'track-card';
      currentCard.querySelector('.play-btn').innerHTML = '&#9654;';
      currentCard.querySelector('.play-btn').classList.remove('playing');
    }
  }

  // Use blob URL if available (uploaded file), otherwise use file path
  const src = track.blobUrl || track.file;
  const audio = new Audio(src);

  audio.addEventListener('error', () => {
    errorEl.style.display = 'block';
    card.className = 'track-card';
    btn.innerHTML = '&#9654;';
    btn.classList.remove('playing');
  });

  audio.addEventListener('loadedmetadata', () => {
    errorEl.style.display = 'none';
    card.querySelector('.time-total').textContent = formatTime(audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    const pct = (audio.currentTime / audio.duration) * 100;
    card.querySelector('.progress-fill').style.width = pct + '%';
    card.querySelector('.time-current').textContent = formatTime(audio.currentTime);
  });

  audio.addEventListener('ended', () => {
    card.className = 'track-card';
    btn.innerHTML = '&#9654;';
    btn.classList.remove('playing');
    currentAudio = null;
    currentCard = null;
  });

  audio.play().then(() => {
    card.className = 'track-card playing';
    btn.innerHTML = '&#9646;&#9646;';
    btn.classList.add('playing');
    currentAudio = audio;
    currentCard = card;
  }).catch(() => {
    errorEl.style.display = 'block';
  });
}

// Event delegation for play buttons and progress bars
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.play-btn');
  if (btn) {
    togglePlay(parseInt(btn.dataset.index));
    return;
  }

  const skipBtn = e.target.closest('.skip-btn');
  if (skipBtn) {
    const index = parseInt(skipBtn.dataset.index);
    const card = document.getElementById('track-' + index);
    if (currentAudio && currentCard === card) {
      const delta = parseInt(skipBtn.dataset.skip);
      currentAudio.currentTime = Math.min(
        Math.max(currentAudio.currentTime + delta, 0),
        currentAudio.duration || Infinity
      );
    } else {
      togglePlay(index);
    }
    return;
  }

  const bar = e.target.closest('.progress-bar');
  if (bar && currentAudio && currentCard === document.getElementById('track-' + bar.dataset.index)) {
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    currentAudio.currentTime = pct * currentAudio.duration;
  }
});

// Upload handling
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('click', () => fileInput.click());

uploadZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadZone.classList.add('dragover');
});

uploadZone.addEventListener('dragleave', () => {
  uploadZone.classList.remove('dragover');
});

uploadZone.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener('change', (e) => {
  handleFiles(e.target.files);
});

function handleFiles(files) {
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('audio/')) return;

    const blobUrl = URL.createObjectURL(file);
    const name = file.name.replace(/\.[^.]+$/, '');

    // Check if it matches an existing track by fuzzy name match
    let matched = false;
    TRACKS.forEach((track, i) => {
      const slug = track.file.split('/').pop().replace('.mp3', '');
      const inputSlug = name.toLowerCase().replace(/[^a-z0-9]/g, '');
      const trackSlug = slug.replace(/-/g, '');

      if (inputSlug.includes(trackSlug) || trackSlug.includes(inputSlug) ||
          name.toLowerCase().includes(track.artist.toLowerCase().split(' ')[0].toLowerCase())) {
        track.blobUrl = blobUrl;
        const errorEl = document.getElementById('error-' + i);
        if (errorEl) errorEl.style.display = 'none';
        matched = true;
      }
    });

    // If no match, add as a new track
    if (!matched) {
      const newIndex = TRACKS.length;
      TRACKS.push({
        title: '"' + name + '"',
        artist: 'Uploaded',
        context: 'Custom',
        file: '',
        blobUrl: blobUrl
      });

      const list = document.getElementById('trackList');
      const card = document.createElement('div');
      card.className = 'track-card';
      card.id = 'track-' + newIndex;
      card.innerHTML = `
        <div class="track-top">
          <div class="track-info">
            <div class="track-title">"${name}"</div>
            <div class="track-artist">Uploaded</div>
            <div class="track-context">Custom</div>
          </div>
          <div class="transport">
            <button class="skip-btn" data-index="${newIndex}" data-skip="-10"><span class="skip-icon">&#8634;</span>10s</button>
            <button class="play-btn" data-index="${newIndex}">&#9654;</button>
            <button class="skip-btn" data-index="${newIndex}" data-skip="10"><span class="skip-icon">&#8635;</span>10s</button>
          </div>
        </div>
        <div class="audio-controls">
          <div class="progress-bar" data-index="${newIndex}">
            <div class="progress-fill"></div>
          </div>
          <div class="time-display">
            <span class="time-current">0:00</span>
            <span class="time-total">0:00</span>
          </div>
        </div>
        <div class="error-msg" id="error-${newIndex}" style="display:none;">File not found.</div>
      `;
      list.appendChild(card);
    }
  });
}

renderTracks();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
