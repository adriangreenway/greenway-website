<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song List &middot; The Greenway Band</title>
<meta name="description" content="The Greenway Band&#8217;s song list.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230A0A09'/%3E%3Ctext x='50' y='66' font-size='46' text-anchor='middle' fill='%23F5F2ED' font-family='serif'%3EG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Proposal palette. Variable names are inverted in the cream body (proposal idiom):
     --black holds cream, --cream holds ink, so component CSS matches the proposal verbatim. */
  :root {
    --black: #F5F2ED;
    --charcoal: #111110;
    --charcoal-mid: #1A1A18;
    --cream: #0A0A09;
    --cream-muted: #2A2A27;
    --cream-dim: #706D66;
    --cream-faint: #4A4740;
    --border: rgba(10,10,9,0.12);
    --border-light: rgba(10,10,9,0.16);
    --border-med: rgba(10,10,9,0.26);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 300;
    font-size: 14px;
    line-height: 1.6;
    background: var(--black);
    color: var(--cream-muted);
    -webkit-text-stroke: 0.35px var(--cream);
  }

  /* ---------- Cover (scoped dark palette, exactly as the proposal cover) ---------- */
  .hero {
    --cream: #F5F2ED;
    --cream-muted: #D4D0C8;
    --cream-dim: #8A867E;
    --cream-faint: #5A5750;
    --border: rgba(245,242,237,0.08);
    --border-light: rgba(245,242,237,0.12);
    --border-med: rgba(245,242,237,0.18);
    background: #0A0A09;
    text-align: center;
    padding: 96px 32px 88px;
    -webkit-text-stroke: 0;
  }

  .logo-group { margin-bottom: 80px; }

  .logo-rule {
    width: 48px;
    height: 0.5px;
    background: var(--cream-dim);
    margin: 0 auto;
  }

  .logo-the {
    font-family: 'Bodoni Moda', serif;
    font-size: 11px;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: var(--cream-dim);
    margin-top: 28px;
    text-indent: 10px;
  }

  .logo-name {
    font-family: 'Bodoni Moda', serif;
    font-size: clamp(28px, 8vw, 42px);
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--cream);
    font-weight: 400;
    margin: 4px 0;
    text-indent: 5px;
  }

  .logo-band {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 10px;
    letter-spacing: 14px;
    text-transform: uppercase;
    color: var(--cream-dim);
    font-weight: 400;
    text-indent: 14px;
  }

  .logo-rule-bottom { margin-top: 16px; }

  .hero h1 {
    font-family: 'Bodoni Moda', serif;
    font-size: clamp(24px, 6vw, 32px);
    font-weight: 400;
    letter-spacing: 1px;
    line-height: 1.3;
    color: var(--cream);
  }

  /* ---------- Sticky genre bar (cream) ---------- */
  .bar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--black);
    border-bottom: 0.5px solid var(--border-light);
  }

  .bar-inner {
    max-width: 880px;
    margin: 0 auto;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .chips {
    flex: 1;
    min-width: 0;
    line-height: 2.4;
  }
  .chips::-webkit-scrollbar { display: none; }

  .chip {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--cream-dim);
    text-decoration: none;
    white-space: nowrap;
    transition: color 0.3s ease;
  }
  .chip:hover { color: var(--cream); }

  .dot {
    color: var(--cream-faint);
    margin: 0 12px;
  }

  .search {
    flex: 0 0 200px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.5px;
    color: var(--cream);
    background: transparent;
    border: none;
    border-bottom: 0.5px solid var(--border-light);
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
    padding: 6px 2px 8px;
    outline: none;
    transition: border-color 0.3s ease;
  }
  .search::placeholder { color: var(--cream-dim); opacity: 1; }
  .search:focus { border-color: var(--cream-dim); }

  /* ---------- Sections ---------- */
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 8px 32px 96px;
  }

  .genre {
    padding-top: 72px;
    scroll-margin-top: 176px;
  }

  .genre-head {
    border-bottom: 0.5px solid var(--border-light);
    padding-bottom: 14px;
  }

  .genre-head h2 {
    font-family: 'Bodoni Moda', serif;
    font-size: clamp(24px, 5vw, 28px);
    font-weight: 400;
    line-height: 1.2;
    color: var(--cream);
  }

  .songs {
    list-style: none;
    margin-top: 6px;
  }
  @media (min-width: 760px) {
    .songs { columns: 2; column-gap: 72px; }
  }

  .song {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    padding: 11px 0;
    border-bottom: 0.5px solid var(--border);
    break-inside: avoid;
  }
  .songs li:last-child { border-bottom: none; }

  .song .t {
    font-size: 14px;
    font-weight: 300;
    line-height: 1.5;
    color: var(--cream-muted);
  }

  .song .a {
    font-size: 12px;
    font-weight: 300;
    line-height: 1.5;
    color: var(--cream-dim);
    text-align: right;
    max-width: 46%;
  }

  .no-results {
    display: none;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: var(--cream-dim);
    padding: 96px 0 48px;
  }

  /* ---------- Footer ---------- */
  footer {
    border-top: 0.5px solid var(--border-light);
    text-align: center;
    padding: 56px 32px 72px;
  }

  footer .contact {
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  footer .contact a {
    color: var(--cream-muted);
    text-decoration: none;
    transition: color 0.3s ease;
  }
  footer .contact a:hover { color: var(--cream); }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px) {
    .hero { padding: 72px 24px 64px; }
    .logo-group { margin-bottom: 64px; }
    .bar-inner { display: block; padding: 14px 24px; }
    .search { display: block; width: 100%; }
    .chips {
      margin-top: 14px;
      display: block;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    main { padding: 0 24px 80px; }
    .genre { scroll-margin-top: 124px; }
    .song { gap: 16px; }
  }

  /* ---------- Print ---------- */
  @media print {
    .bar, .no-results { display: none; }
    body { -webkit-text-stroke: 0; }
    .hero {
      --cream: #0A0A09;
      --cream-muted: #2A2A27;
      --cream-dim: #706D66;
      --cream-faint: #4A4740;
      background: none;
      padding: 0 0 40px;
    }
    .logo-group { margin-bottom: 48px; }
    .hero h1 { font-size: 26px; }
    main { max-width: none; padding: 0; }
    .genre { padding-top: 28px; }
    .genre-head { break-after: avoid; padding-bottom: 8px; }
    .songs { columns: 2; column-gap: 48px; }
    .song { padding: 5px 0; border-bottom: none; }
    footer {
      border-top: 0.5px solid #0A0A09;
      margin-top: 40px;
      padding: 24px 0 0;
    }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="logo-group">
    <div class="logo-rule"></div>
    <div class="logo-the">THE</div>
    <div class="logo-name">GREENWAY</div>
    <div class="logo-band">BAND</div>
    <div class="logo-rule logo-rule-bottom"></div>
  </div>
  <h1>Song List</h1>
</header>

<nav class="bar">
  <div class="bar-inner">
    <div class="chips">
@@NAV@@
    </div>
    <input class="search" id="q" type="search" placeholder="Search songs or artists" aria-label="Search songs or artists">
  </div>
</nav>

<main>
@@SECTIONS@@
  <div class="no-results" id="none">No matches.</div>
</main>

<footer>
  <p class="contact">
    <a href="https://greenwayband.com">greenwayband.com</a><span class="dot">&middot;</span><a href="mailto:adrian@greenwayband.com">adrian@greenwayband.com</a>
  </p>
</footer>

<script>
  (function () {
    var q = document.getElementById('q');
    var none = document.getElementById('none');
    var songs = [].slice.call(document.querySelectorAll('.song'));
    var sections = [].slice.call(document.querySelectorAll('.genre'));
    function fold(s) {
      return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\u2019/g, "'");
    }
    q.addEventListener('input', function () {
      var needle = fold(q.value.trim());
      var any = false;
      songs.forEach(function (li) {
        var hit = !needle || li.getAttribute('data-q').indexOf(needle) !== -1;
        li.style.display = hit ? '' : 'none';
        if (hit) any = true;
      });
      sections.forEach(function (sec) {
        var visible = sec.querySelectorAll('.song:not([style*="none"])').length > 0;
        sec.style.display = visible ? '' : 'none';
      });
      none.style.display = any ? 'none' : 'block';
    });
  })();
</script>

</body>
</html>
