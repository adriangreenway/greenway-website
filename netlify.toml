[[redirects]]
  from = "https://greenway-website.netlify.app/*"
  to = "https://greenwayband.com/:splat"
  status = 301
  force = true

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
