// ─── STORAGE (localStorage, Block 2 namespace) ───────────────────────
function loadLog(k) {
  try {
    const raw = localStorage.getItem("nbb2:" + k);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) return parsed;
    return {};
  } catch { return {}; }
}
function saveLog(k, v) {
  try { localStorage.setItem("nbb2:" + k, JSON.stringify(v)); return true; }
  catch(e) { console.error("save error", e); return false; }
}
function loadLoggedDates(m) {
  try { const r = localStorage.getItem("nbb2-dates:" + m); return r ? JSON.parse(r) : []; }
  catch { return []; }
}
function addLoggedDate(m, d) {
  try { const e = loadLoggedDates(m); if (!e.includes(d)) { e.push(d); localStorage.setItem("nbb2-dates:" + m, JSON.stringify(e)); } }
  catch(e) { console.error(e); }
}

          </div>
          <Dd l="FAILURE" v={ex.failure} c={amber} i />
          <div style={{ fontFamily: mono, fontSize: 10, color: textMuted, marginTop: 8 }}>REST: {ex.rest}</div>
        </div>
      )}
    </div>
  );
}

function Dd({ l, v, c, i }) {
  return <div style={{ marginBottom: 10 }}><div style={lbl}>{l}</div><div style={{ fontFamily: sans, fontSize: 12, color: c || textSecondary, fontStyle: i ? "italic" : "normal", lineHeight: 1.5 }}>{v}</div></div>;
}

// ─── EXERCISE LOG CARD (Log Tab) ────────────────────────────────────
function ExerciseLogCard({ exKey, name, programSets, logData, onUpdate }) {
  const [open, setOpen] = useState(false);
  const [addingSet, setAddingSet] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({ w: "", r: "", notes: "" });
  const sets = logData || [];
  const logged = sets.length > 0;

  const saveSet = () => {
    if (!form.w && !form.r) return;
    if (editId !== null) {
      const updated = sets.map(s => s.id === editId ? { ...s, w: form.w, r: form.r, notes: form.notes } : s);
      onUpdate(exKey, updated);
      setEditId(null);
    } else {
      const entry = { id: Date.now(), w: form.w, r: form.r, notes: form.notes };
      onUpdate(exKey, [...sets, entry]);
    }
    setForm({ w: "", r: "", notes: "" });
    setAddingSet(false);
  };

  const delSet = (id) => { onUpdate(exKey, sets.filter(s => s.id !== id)); };
  const startEdit = (s) => { setEditId(s.id); setForm({ w: s.w, r: s.r, notes: s.notes || "" }); setAddingSet(true); setOpen(true); };
  const cancelAdd = () => { setAddingSet(false); setEditId(null); setForm({ w: "", r: "", notes: "" }); };

  const smallInput = { padding: "10px", background: "#FFF", border: `1px solid ${border}`, borderRadius: 8, color: textPrimary, fontFamily: mono, fontSize: 14, boxSizing: "border-box", outline: "none", width: "100%", textAlign: "center" };

  return (
    <div style={{ background: logged ? "#F0FDF4" : bgCard, border: `1px solid ${logged ? "#BBF7D0" : border}`, borderRadius: 12, marginBottom: 6, overflow: "hidden", transition: "all 0.15s" }}>
      <button onClick={() => setOpen(!open)} style={{ width: "100%", display: "flex", alignItems: "center", gap: 8, padding: "12px 14px", background: "none", border: "none", cursor: "pointer", textAlign: "left" }}>
        {logged
          ? <div style={{ width: 18, height: 18, borderRadius: 9, background: "#16A34A", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><span style={{ color: "#FFF", fontSize: 10, fontWeight: 900 }}>✓</span></div>
          : <div style={{ width: 18, height: 18, borderRadius: 9, border: `2px solid ${borderLight}`, flexShrink: 0 }} />
        }
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontFamily: sans, fontSize: 13, fontWeight: 600, color: textPrimary, lineHeight: 1.3 }}>{name}</div>
          {logged && !open && <div style={{ fontFamily: mono, fontSize: 10, color: "#16A34A", marginTop: 2 }}>{sets.length} set{sets.length !== 1 ? "s" : ""} logged</div>}
        </div>
        <span style={{ fontSize: 9, color: textFaint, transform: open ? "rotate(180deg)" : "", transition: "transform 0.15s", flexShrink: 0 }}>▼</span>
      </button>
      {open && (
        <div style={{ padding: "0 14px 14px" }}>
          {programSets && programSets.length > 0 && (
            <div style={{ marginBottom: 10, padding: "8px 10px", background: "rgba(0,0,0,0.02)", borderRadius: 8 }}>
              <div style={{ fontFamily: mono, fontSize: 8, fontWeight: 700, color: textMuted, letterSpacing: "0.1em", marginBottom: 4 }}>PROGRAMMED</div>
              {programSets.map((s, i) => <div key={i} style={{ fontFamily: mono, fontSize: 10, color: textMuted, lineHeight: 1.6 }}>{i + 1}. {s}</div>)}
            </div>
          )}
          {sets.map((s, i) => (
            <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 10px", background: bg, borderRadius: 8, marginBottom: 3, borderLeft: "3px solid #16A34A" }}>
              <span style={{ fontFamily: mono, fontSize: 10, color: textMuted, minWidth: 14 }}>{i + 1}</span>
              <div style={{ flex: 1 }}>
                <span style={{ fontFamily: mono, fontSize: 13, fontWeight: 700, color: textPrimary }}>
                  {s.w && `${s.w} lbs`}{s.w && s.r && " × "}{s.r && `${s.r} reps`}
                </span>
                {s.notes && <div style={{ fontFamily: sans, fontSize: 10, color: textMuted, marginTop: 1 }}>{s.notes}</div>}
              </div>
              <button onClick={() => startEdit(s)} style={{ background: "none", border: "none", color: textMuted, cursor: "pointer", fontSize: 12, padding: "2px 4px" }}>✎</button>
              <button onClick={() => delSet(s.id)} style={{ background: "none", border: "none", color: textFaint, cursor: "pointer", fontSize: 16, padding: "0 2px" }}>×</button>
            </div>
          ))}
          {addingSet ? (
            <div style={{ marginTop: 6, padding: 10, background: amberBg, borderRadius: 10, border: "1px solid #FDE68A" }}>
              <div style={{ fontFamily: mono, fontSize: 8, fontWeight: 700, color: amberLight, letterSpacing: "0.1em", marginBottom: 6 }}>{editId !== null ? "EDIT SET" : `SET ${sets.length + 1}`}</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginBottom: 6 }}>
                <input value={form.w} onChange={e => setForm({...form, w: e.target.value})} placeholder="Weight" type="number" style={smallInput} />
                <input value={form.r} onChange={e => setForm({...form, r: e.target.value})} placeholder="Reps" type="number" style={smallInput} />
              </div>
              <input value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} placeholder="Notes (optional)" style={{ ...smallInput, textAlign: "left", marginBottom: 8, fontFamily: sans, fontSize: 12 }} />
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={saveSet} style={{ flex: 1, padding: "10px", background: amberLight, color: "#FFF", border: "none", borderRadius: 8, fontFamily: sans, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>{editId !== null ? "Update" : "Save"}</button>
                <button onClick={cancelAdd} style={{ padding: "10px 14px", background: bgSub, color: textMuted, border: `1px solid ${border}`, borderRadius: 8, fontFamily: sans, fontSize: 13, cursor: "pointer" }}>X</button>
              </div>
            </div>
          ) : (
            <button onClick={() => { setAddingSet(true); setEditId(null); setForm({ w: "", r: "", notes: "" }); }} style={{ width: "100%", marginTop: 4, padding: "10px", background: "none", border: `1px dashed ${border}`, borderRadius: 8, color: textMuted, fontFamily: sans, fontSize: 12, cursor: "pointer" }}>+ Add Set</button>
          )}
        </div>
      )}
    </div>
  );
}

// ─── TRACKER TAB ─────────────────────────────────────────────────────
function TrackerTab() {
  const today = new Date();
  const [month, setMonth] = useState(today.getMonth());
  const [year, setYear] = useState(today.getFullYear());
  const [selectedDate, setSelectedDate] = useState(null);
  const [dayLog, setDayLog] = useState({});
  const [loggedDays, setLoggedDays] = useState([]);
  const [addingCustom, setAddingCustom] = useState(false);
  const [customName, setCustomName] = useState("");

  const dayLogRef = useRef(dayLog);
  useEffect(() => { dayLogRef.current = dayLog; }, [dayLog]);
  const selectedDateRef = useRef(selectedDate);
  useEffect(() => { selectedDateRef.current = selectedDate; }, [selectedDate]);
  const monthKey = `${year}-${String(month + 1).padStart(2, "0")}`;
  const monthKeyRef = useRef(monthKey);
  useEffect(() => { monthKeyRef.current = monthKey; }, [monthKey]);

  const mNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const dNames = ["Su","Mo","Tu","We","Th","Fr","Sa"];

  useEffect(() => { setLoggedDays(loadLoggedDates(monthKey)); }, [monthKey]);
  useEffect(() => {
    if (selectedDate) {
      const d = loadLog(selectedDate);
      setDayLog(d);
      dayLogRef.current = d;
    } else {
      setDayLog({});
      dayLogRef.current = {};
    }
  }, [selectedDate]);

  const firstDay = new Date(year, month, 1).getDay();
  const dim = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= dim; d++) cells.push(d);

  const prev = () => { if (month === 0) { setMonth(11); setYear(y => y-1); } else setMonth(m => m-1); setSelectedDate(null); };
  const next = () => { if (month === 11) { setMonth(0); setYear(y => y+1); } else setMonth(m => m+1); setSelectedDate(null); };

  const getDayInfo = (ds) => {
    if (!ds) return null;
    const d = new Date(ds + "T12:00:00");
    const labels = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    return DAYS.find(x => x.day === labels[d.getDay()]) || null;
  };

  const programDay = getDayInfo(selectedDate);

  const getExerciseList = () => {
    if (!programDay) return [];
    const list = [];
    if (programDay.exercises) {
      programDay.exercises.forEach((ex, i) => {
        list.push({ key: "ex_" + i, name: ex.name, programSets: ex.sets, type: "exercise" });
      });
    }
    if (programDay.abs) {
      programDay.abs.forEach((a, i) => {
        list.push({ key: "core_" + i, name: a.name, programSets: [a.detail], type: "core" });
      });
    }
    const customKeys = Object.keys(dayLog).filter(k => k.startsWith("custom_"));
    customKeys.forEach(k => {
      const data = dayLog[k];
      if (data && data.length > 0 && data[0]._name) {
        list.push({ key: k, name: data[0]._name, programSets: null, type: "custom" });
      }
    });
    return list;
  };

  const persist = useCallback((newLog) => {
    setDayLog(newLog);
    dayLogRef.current = newLog;
    const date = selectedDateRef.current;
    if (!date) return;
    saveLog(date, newLog);
    const dayNum = parseInt(date.split("-")[2]);
    const hasAny = Object.values(newLog).some(arr => Array.isArray(arr) && arr.filter(s => !s._name).length > 0);
    if (hasAny) {
      addLoggedDate(monthKeyRef.current, dayNum);
      setLoggedDays(prev => prev.includes(dayNum) ? prev : [...prev, dayNum]);
    }
  }, []);

  const handleUpdate = useCallback((exKey, sets) => {
    const current = dayLogRef.current;
    const newLog = { ...current, [exKey]: sets };
    persist(newLog);
  }, [persist]);

  const addCustomExercise = () => {
    if (!customName.trim()) return;
    const current = dayLogRef.current;
    const idx = Object.keys(current).filter(k => k.startsWith("custom_")).length;
    const key = "custom_" + idx + "_" + Date.now();
    const newLog = { ...current, [key]: [{ _name: customName.trim() }] };
    persist(newLog);
    setCustomName("");
    setAddingCustom(false);
  };

  const removeCustom = (key) => {
    const current = { ...dayLogRef.current };
    delete current[key];
    persist(current);
  };

  const todayStr = today.getFullYear() + "-" + String(today.getMonth()+1).padStart(2,"0") + "-" + String(today.getDate()).padStart(2,"0");
  const exercises = selectedDate ? getExerciseList() : [];

  const totalSets = Object.entries(dayLog).reduce((sum, [, arr]) => {
    if (!Array.isArray(arr)) return sum;
    return sum + arr.filter(s => !s._name && (s.w || s.r)).length;
  }, 0);

  return (
    <div style={{ padding: "16px 14px 100px" }}>
      <h2 style={{ fontFamily: serif, fontSize: 22, fontWeight: 700, color: textPrimary, margin: "0 0 14px" }}>Training Log</h2>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <button onClick={prev} style={navBtn}>◀</button>
        <span style={{ fontFamily: sans, fontSize: 15, fontWeight: 700, color: textPrimary }}>{mNames[month]} {year}</span>
        <button onClick={next} style={navBtn}>▶</button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3, marginBottom: 16 }}>
        {dNames.map(d => <div key={d} style={{ textAlign: "center", fontFamily: mono, fontSize: 8, color: textMuted, padding: "4px 0", fontWeight: 700 }}>{d}</div>)}
        {cells.map((d, i) => {
          if (!d) return <div key={"e"+i} />;
          const ds = year + "-" + String(month+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
          const isTd = ds === todayStr;
          const isSel = ds === selectedDate;
          const has = loggedDays.includes(d);
          return (
            <button key={i} onClick={() => setSelectedDate(ds)} style={{ aspectRatio: "1", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: isSel ? amberLight : isTd ? bgSub : "transparent", border: isTd && !isSel ? `1.5px solid ${amberLight}` : "1.5px solid transparent", borderRadius: 10, cursor: "pointer" }}>
              <span style={{ fontFamily: mono, fontSize: 12, fontWeight: isSel ? 800 : 500, color: isSel ? "#FFF" : isTd ? amberLight : textSecondary }}>{d}</span>
              {has && <div style={{ width: 5, height: 5, borderRadius: "50%", background: isSel ? "#FFF" : "#16A34A", marginTop: 1 }} />}
            </button>
          );
        })}
      </div>
      {selectedDate && programDay && (
        <div>
          <div style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
              <span style={{ fontFamily: mono, fontSize: 8, fontWeight: 700, color: "#FFF", background: tagColors[programDay.tag] || programDay.color, padding: "3px 7px", borderRadius: 4, letterSpacing: "0.08em" }}>{programDay.tag}</span>
              <span style={{ fontFamily: mono, fontSize: 10, color: textMuted }}>{selectedDate}</span>
            </div>
            <div style={{ fontFamily: serif, fontSize: 18, fontWeight: 700, color: textPrimary, lineHeight: 1.25 }}>{programDay.title}</div>
            {totalSets > 0 && <div style={{ fontFamily: mono, fontSize: 10, color: "#16A34A", marginTop: 4 }}>{totalSets} total set{totalSets !== 1 ? "s" : ""} logged</div>}
          </div>
          {programDay.tag === "REST" && (
            <div style={{ padding: 20, background: bgCard, border: `1px solid ${border}`, borderRadius: 12, textAlign: "center" }}>
              <div style={{ fontSize: 28, marginBottom: 8 }}>🧘</div>
              <div style={{ fontFamily: sans, fontSize: 13, color: textSecondary }}>Rest day. Walk, mobility, recover.</div>
            </div>
          )}
          {programDay.exercises && (
            <React.Fragment>
              <div style={{ ...lbl, marginBottom: 6, marginTop: 4 }}>EXERCISES</div>
              {exercises.filter(e => e.type === "exercise").map(ex => (
                <ExerciseLogCard key={ex.key} exKey={ex.key} name={ex.name} programSets={ex.programSets} logData={(dayLog[ex.key] || []).filter(s => !s._name)} onUpdate={handleUpdate} />
              ))}
            </React.Fragment>
          )}
          {exercises.filter(e => e.type === "core").length > 0 && (
            <React.Fragment>
              <div style={{ ...lbl, marginBottom: 6, marginTop: 12 }}>CORE</div>
              {exercises.filter(e => e.type === "core").map(ex => (
                <ExerciseLogCard key={ex.key} exKey={ex.key} name={ex.name} programSets={ex.programSets} logData={(dayLog[ex.key] || []).filter(s => !s._name)} onUpdate={handleUpdate} />
              ))}
            </React.Fragment>
          )}
          {exercises.filter(e => e.type === "custom").length > 0 && (
            <React.Fragment>
              <div style={{ ...lbl, marginBottom: 6, marginTop: 12 }}>CUSTOM</div>
              {exercises.filter(e => e.type === "custom").map(ex => (
                <div key={ex.key}>
                  <ExerciseLogCard exKey={ex.key} name={ex.name} programSets={null} logData={(dayLog[ex.key] || []).filter(s => !s._name)} onUpdate={handleUpdate} />
                  <button onClick={() => removeCustom(ex.key)} style={{ display: "block", margin: "-2px auto 8px", background: "none", border: "none", fontFamily: mono, fontSize: 9, color: textFaint, cursor: "pointer" }}>Remove custom exercise</button>
                </div>
              ))}
            </React.Fragment>
          )}
          {programDay.tag !== "REST" && (
            <div style={{ marginTop: 12 }}>
              {addingCustom ? (
                <div style={{ padding: 12, background: amberBg, border: "1px solid #FDE68A", borderRadius: 10 }}>
                  <input value={customName} onChange={e => setCustomName(e.target.value)} placeholder="Exercise name" style={{ ...inputStyle, background: "#FFF", marginBottom: 8 }} />
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={addCustomExercise} style={{ flex: 1, padding: "10px", background: amberLight, color: "#FFF", border: "none", borderRadius: 8, fontFamily: sans, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Add</button>
                    <button onClick={() => { setAddingCustom(false); setCustomName(""); }} style={{ padding: "10px 14px", background: bgSub, color: textMuted, border: `1px solid ${border}`, borderRadius: 8, fontFamily: sans, fontSize: 13, cursor: "pointer" }}>X</button>
                  </div>
                </div>
              ) : (
                <button onClick={() => setAddingCustom(true)} style={{ width: "100%", padding: "12px", background: "none", border: `1px dashed ${border}`, borderRadius: 10, color: textMuted, fontFamily: sans, fontSize: 12, cursor: "pointer" }}>+ Add Custom Exercise</button>
              )}
            </div>
          )}
        </div>
      )}
      {selectedDate && !programDay && <div style={{ padding: 20, textAlign: "center", color: textMuted, fontSize: 12 }}>No program data for this day.</div>}
    </div>
  );
}

// ─── BARBELL CALC TAB ────────────────────────────────────────────────
function BarbellTab() {
  const [perSide, setPerSide] = useState([]);
  const total = 45 + perSide.reduce((s, p) => s + p * 2, 0);
  const perSideTotal = perSide.reduce((s, p) => s + p, 0);
  const add = (w) => setPerSide(p => [...p, w]);
  const undo = () => setPerSide(p => p.slice(0, -1));
  const clear = () => setPerSide([]);
  const getPlate = (w) => PLATES.find(p => p.weight === w);

  function renderSide(plates, startX, dir) {
    let x = startX;
    return plates.map((w, i) => {
      const p = getPlate(w);
      if (!p) return null;
      const px = dir === 1 ? x : x - p.w;
      x += dir * (p.w + 1.5);
      return React.createElement("rect", { key: dir+"-"+i, x: px, y: 75 - p.h/2, width: p.w, height: p.h, rx: 2.5, fill: p.color, stroke: "rgba(0,0,0,0.1)", strokeWidth: 0.6, style: { animation: "plateIn 0.2s ease-out", transformOrigin: (px + p.w/2)+"px 75px" } });
    });
  }
  const counts = {};
  perSide.forEach(w => { counts[w] = (counts[w] || 0) + 1; });

  return (
    <div style={{ padding: "16px 14px 100px" }}>
      <h2 style={{ fontFamily: serif, fontSize: 22, fontWeight: 700, color: textPrimary, margin: "0 0 4px" }}>Barbell Calculator</h2>
      <div style={{ fontFamily: mono, fontSize: 9, color: textMuted, marginBottom: 16 }}>45 LB STANDARD BAR</div>
      <div style={{ textAlign: "center", padding: "20px 0 16px", background: bgCard, borderRadius: 16, border: `1px solid ${border}`, marginBottom: 14 }}>
        <div style={{ fontFamily: mono, fontSize: 9, color: textMuted, letterSpacing: "0.12em" }}>TOTAL</div>
        <div style={{ fontFamily: serif, fontSize: 56, fontWeight: 900, color: amberLight, lineHeight: 1, marginTop: 4 }}>{total}</div>
        <div style={{ fontFamily: mono, fontSize: 11, color: textMuted, marginTop: 4 }}>lbs{perSide.length > 0 && (" · " + perSideTotal + "/side")}</div>
      </div>
      <div style={{ background: "#F1F1EE", borderRadius: 14, padding: "8px 0", marginBottom: 14, border: `1px solid ${border}`, overflow: "hidden" }}>
        <svg viewBox="0 0 340 150" style={{ width: "100%", height: 110, display: "block" }}>
          <rect x={8} y={67} width={14} height={16} rx={3} fill="#AAA" />
          <rect x={318} y={67} width={14} height={16} rx={3} fill="#AAA" />
          <rect x={22} y={71} width={296} height={8} rx={3} fill="#BCBCBC" />
          <rect x={155} y={69.5} width={30} height={11} rx={2} fill="#A0A0A0" />
          <rect x={76} y={63} width={7} height={24} rx={2} fill="#AAA" />
          <rect x={257} y={63} width={7} height={24} rx={2} fill="#AAA" />
          {renderSide([...perSide].reverse(), 74, -1)}
          {renderSide(perSide, 266, 1)}
        </svg>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, marginBottom: 10 }}>
        {PLATES.map(p => (
          <button key={p.weight} onClick={() => add(p.weight)} style={{ padding: "14px 6px", background: "#FFF", border: `2px solid ${p.color}30`, borderRadius: 12, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
            <span style={{ fontFamily: serif, fontSize: 22, fontWeight: 900, color: p.color }}>{p.label}</span>
            <span style={{ fontFamily: mono, fontSize: 8, color: textMuted }}>per side</span>
          </button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <button onClick={undo} disabled={!perSide.length} style={{ flex: 1, padding: "14px", background: bgSub, border: `1px solid ${border}`, color: perSide.length ? textSecondary : textFaint, borderRadius: 10, fontFamily: sans, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Undo</button>
        <button onClick={clear} disabled={!perSide.length} style={{ flex: 1, padding: "14px", background: perSide.length ? "#FEF2F2" : bgSub, border: `1px solid ${perSide.length ? "#FECACA" : border}`, color: perSide.length ? "#DC2626" : textFaint, borderRadius: 10, fontFamily: sans, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Clear</button>
      </div>
      {perSide.length > 0 && (
        <div style={{ padding: 12, background: bgCard, borderRadius: 10, border: `1px solid ${border}` }}>
          <div style={{ ...lbl, marginBottom: 8 }}>PER SIDE</div>
          {Object.entries(counts).sort((a,b) => Number(b[0])-Number(a[0])).map(([w, c]) => {
            const p = getPlate(Number(w));
            return (
              <div key={w} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 0" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <div style={{ width: 10, height: 10, borderRadius: 2, background: p ? p.color : "#999" }} />
                  <span style={{ fontFamily: mono, fontSize: 12, color: textSecondary }}>{w} lb</span>
                </div>
                <span style={{ fontFamily: mono, fontSize: 13, color: amberLight, fontWeight: 700 }}>× {c}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── DROP % CALC TAB ─────────────────────────────────────────────────
function DropCalcTab() {
  const [weight, setWeight] = useState("");
  const [custom, setCustom] = useState("");
  const drops = [5, 10, 12, 15, 20, 25, 30];
  const w = parseFloat(weight) || 0;
  const round5 = (v) => Math.round(v / 5) * 5;
  const round2 = (v) => Math.round(v / 2.5) * 2.5;

  return (
    <div style={{ padding: "16px 14px 100px" }}>
      <h2 style={{ fontFamily: serif, fontSize: 22, fontWeight: 700, color: textPrimary, margin: "0 0 4px" }}>Drop % Calculator</h2>
      <div style={{ fontFamily: mono, fontSize: 9, color: textMuted, marginBottom: 20 }}>PERCENTAGE REDUCTION FROM WORKING WEIGHT</div>
      <div style={{ marginBottom: 20 }}>
        <div style={{ ...lbl, marginBottom: 6 }}>WORKING WEIGHT (LBS)</div>
        <input type="number" value={weight} onChange={e => setWeight(e.target.value)} placeholder="0" style={{ ...inputStyle, fontSize: 32, fontFamily: serif, fontWeight: 900, textAlign: "center", padding: "18px", color: amberLight, background: "#FFF", border: `2px solid ${border}` }} />
      </div>
      {w > 0 && (
        <React.Fragment>
          <div style={{ ...lbl, marginBottom: 8 }}>DROP TARGETS</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 16 }}>
            {drops.map(d => {
              const reduced = w * (1 - d / 100);
              const r5 = round5(reduced);
              const r2 = round2(reduced);
              return (
                <div key={d} style={{ padding: "14px 10px", background: bgCard, border: `1px solid ${border}`, borderRadius: 12, textAlign: "center", boxShadow: "0 1px 3px rgba(0,0,0,0.04)" }}>
                  <div style={{ fontFamily: mono, fontSize: 10, color: "#DC2626", fontWeight: 700, marginBottom: 6 }}>−{d}%</div>
                  <div style={{ fontFamily: serif, fontSize: 30, fontWeight: 900, color: textPrimary, lineHeight: 1 }}>{r5}</div>
                  <div style={{ fontFamily: mono, fontSize: 9, color: textMuted, marginTop: 4 }}>nearest 5</div>
                  {r2 !== r5 && <div style={{ fontFamily: mono, fontSize: 10, color: textSecondary, marginTop: 3 }}>or {r2}</div>}
                </div>
              );
            })}
          </div>
          <div style={{ padding: 14, background: amberBg, borderRadius: 12, border: "1px solid #FDE68A", marginBottom: 16 }}>
            <div style={{ ...lbl, marginBottom: 8 }}>CUSTOM DROP</div>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <span style={{ fontFamily: mono, fontSize: 16, color: "#DC2626", fontWeight: 700 }}>−</span>
              <input type="number" value={custom} onChange={e => setCustom(e.target.value)} placeholder="%" style={{ ...inputStyle, flex: 1, textAlign: "center", marginBottom: 0, background: "#FFF" }} />
              <span style={{ fontFamily: mono, fontSize: 14, color: textMuted }}>%</span>
            </div>
            {custom && parseFloat(custom) > 0 && (
              <div style={{ textAlign: "center", marginTop: 14 }}>
                <div style={{ fontFamily: serif, fontSize: 40, fontWeight: 900, color: amberLight }}>{round5(w * (1 - parseFloat(custom) / 100))}</div>
                <div style={{ fontFamily: mono, fontSize: 10, color: textMuted }}>lbs (nearest 5)</div>
              </div>
            )}
          </div>
          <div style={{ padding: 14, background: bgCard, borderRadius: 12, border: `1px solid ${border}` }}>
            <div style={{ ...lbl, marginBottom: 8 }}>WARM-UP RAMP FROM {w}</div>
            {[50, 65, 70, 75, 80, 85].map(pct => (
              <div key={pct} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${borderLight}` }}>
                <span style={{ fontFamily: mono, fontSize: 12, color: textMuted }}>{pct}%</span>
                <span style={{ fontFamily: mono, fontSize: 13, color: textPrimary, fontWeight: 600 }}>{round5(w * pct / 100)}</span>
              </div>
            ))}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// ─── MAIN ────────────────────────────────────────────────────────────
const TABS = [
  { id: "program", label: "Program", icon: "📋" },
  { id: "track", label: "Log", icon: "📊" },
  { id: "bar", label: "Barbell", icon: "🏋️" },
  { id: "drop", label: "Drop %", icon: "📉" },
];

function App() {
  const [tab, setTab] = useState("program");
  return (
    <div style={{ fontFamily: sans, background: bg, minHeight: "100vh", maxWidth: 520, margin: "0 auto", color: textPrimary }}>
      <div style={{ background: textPrimary, padding: "max(env(safe-area-inset-top, 12px), 22px) 16px 16px", textAlign: "center" }}>
        <div style={{ fontFamily: mono, fontSize: 8, letterSpacing: "0.18em", color: amberLight, marginBottom: 4, fontWeight: 700 }}>ADRIAN'S BODYBUILDING BLOCK</div>
        <h1 style={{ fontFamily: serif, fontSize: 22, fontWeight: 900, color: "#FFF", margin: 0 }}>Natural Bodybuilding Block II</h1>
        <div style={{ fontFamily: mono, fontSize: 9, color: textMuted, marginTop: 4, letterSpacing: "0.08em" }}>SHOCK CYCLE · PUSH / PULL / LEGS × 2</div>
      </div>
      {tab === "program" && <ProgramTab />}
      {tab === "track" && <TrackerTab />}
      {tab === "bar" && <BarbellTab />}
      {tab === "drop" && <DropCalcTab />}
      <div style={{
        position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)",
        width: "100%", maxWidth: 520,
        display: "flex", background: "rgba(255,255,255,0.96)", backdropFilter: "blur(20px)",
        borderTop: `1px solid ${border}`, padding: "4px 0 max(env(safe-area-inset-bottom, 6px), 6px)", zIndex: 100
      }}>
        {TABS.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{
            flex: 1, background: "none", border: "none", cursor: "pointer",
            display: "flex", flexDirection: "column", alignItems: "center", gap: 1, padding: "8px 4px"
          }}>
            <span style={{ fontSize: 18, filter: tab === t.id ? "none" : "grayscale(1) opacity(0.35)" }}>{t.icon}</span>
            <span style={{ fontFamily: mono, fontSize: 7, fontWeight: 700, color: tab === t.id ? amberLight : textFaint, letterSpacing: "0.06em" }}>{t.label.toUpperCase()}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
